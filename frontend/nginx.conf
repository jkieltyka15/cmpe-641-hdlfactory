# Nginx config for serving the HDLFACTORY SPA and proxying API traffic.
server {
    # Serve the static frontend assets.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback routes all unknown paths to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to the backend FastAPI container.
    location /api/ {
        proxy_pass http://hdlfactory-backend:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
