# HDLFACTORY local development stack.
# Brings up frontend, backend API, worker, Redis queue, and Ollama model runtime.
services:
  # Redis backs the job queue between API and worker.
  redis:
    image: redis:7-alpine
    container_name: hdlfactory-redis
    restart: unless-stopped

  # Ollama serves the configured LLM over HTTP for generation requests.
  ollama:
    image: ollama/ollama
    container_name: hdlfactory-ollama
    volumes:
      - ollama_models:/root/.ollama
    devices:
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_VULKAN=1
      - OLLAMA_LOAD_TIMEOUT=10m0s
      - OLLAMA_KEEP_ALIVE=10m0s
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-time initialization job to pre-pull the required model.
  ollama-init:
    image: curlimages/curl:8.12.1
    container_name: hdlfactory-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    # Use an explicit shell invocation to avoid compose argument tokenization
    # issues that can truncate scripts when using `entrypoint: ["/bin/sh", "-c"]`.
    command:
      - /bin/sh
      - -ec
      - |
        echo "Waiting for Ollama..."
        curl -fsS http://ollama:11434/api/tags >/dev/null
        echo "Pulling ministral-3:3b..."
        curl -fsS -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{"name":"ministral-3:3b","stream":false}'
        echo "Pulling codestral:22B..."
        curl -fsS -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{"name":"codestral:22B","stream":false}'
        echo "Model pull complete."
    restart: "no"

  # FastAPI service that accepts jobs and exposes status/history APIs.
  backend:
    build: ./backend
    container_name: hdlfactory-backend
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/jobs:/app/jobs
      - ./backend/data:/app/data
    restart: unless-stopped

  # Background processor that dequeues and validates generated Verilog.
  worker:
    build: ./worker
    container_name: hdlfactory-worker
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/jobs:/app/jobs
      - ./backend/data:/app/data
    restart: unless-stopped
    

  # (codestral optimization is provided via the Ollama model `codestral:22B`)

  # Static frontend served by nginx.
  frontend:
    build: ./frontend
    container_name: hdlfactory-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  # Persisted Ollama model cache across container restarts.
  ollama_models:
  # (no local codestral binary volume required; Ollama model is used)
